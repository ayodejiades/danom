[profile.default]
src = "contracts/src"
out = "contracts/out"
libs = ["lib"]
test = "contracts/test"
script = "contracts/script"
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "forge-std/=lib/forge-std/src/"
]
fs_permissions = [{ access = "read", path = "./" }]
